name: Idea · Idée
description: Suggest an improvement · Proposer une amélioration
labels: ["idée"]
body:
  - type: textarea
    id: besoin
    attributes:
      label: Need · Besoin
      description: What you want to do, and why · Ce que vous voulez faire et pourquoi.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Headphones command involved, if any · Commande du casque concernée
      description: A new write is added only after a capture of the official app and a check on the headphones. Say where the command comes from; do not invent one · Indiquez d'où vient la commande ; n'en inventez aucune.
