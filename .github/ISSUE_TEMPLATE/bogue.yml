name: Bogue
description: Un comportement inattendu d'OpenHeadset Control
labels: ["bogue"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Avant d'envoyer : ni adresse Bluetooth complète, ni numéro de série, ni nom d'appareil personnel, ni chemin de dossier personnel.
  - type: input
    id: version
    attributes:
      label: Version
      description: Visible dans « À propos » ou avec `ctl --version`.
      placeholder: "0.8.0"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - WinUI 3 (Windows)
        - Client KDE (Linux)
        - ctl
        - probe
        - Service momentum-daemon
    validations:
      required: true
  - type: input
    id: systeme
    attributes:
      label: Système
      placeholder: "Windows 11 24H2, ou Bazzite 44 (KDE Plasma 6, Wayland)"
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes et résultat
      description: Ce que vous avez fait, ce que vous attendiez, ce qui s'est passé.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic expurgé
      description: Page « À propos » > « Copier le diagnostic ». Relisez-le avant de le coller.
      render: text
