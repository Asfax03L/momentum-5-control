name: Compatibility · Compatibilité
description: Report a model or firmware not validated yet · Signaler un modèle ou un micrologiciel non encore validé
labels: ["compatibilité"]
body:
  - type: markdown
    attributes:
      value: |
        On a model or firmware that is not validated, OpenHeadset Control stays **read-only**: no setting is sent. This report helps decide what to verify. The project never offers a firmware update or a reset.

        Sur un modèle ou un micrologiciel non validé, OpenHeadset Control reste en **lecture seule** : aucun réglage n'est envoyé. Ce rapport aide à décider quoi vérifier. Le projet ne propose jamais de mise à jour du micrologiciel ni de réinitialisation.
  - type: input
    id: modele
    attributes:
      label: Model as read · Modèle lu
      description: The “Model” line of `probe --deep` or of the About page · Ligne « Modèle » de `probe --deep` ou de la page « À propos ».
      placeholder: "M5AEBT Black"
    validations:
      required: true
  - type: input
    id: micrologiciel
    attributes:
      label: Firmware as read · Micrologiciel lu
      placeholder: "6.21.5"
    validations:
      required: true
  - type: input
    id: systeme
    attributes:
      label: System · Système
      placeholder: "Windows 11, ou Linux (distribution, bureau)"
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Output of `probe --deep` · Sortie de `probe --deep`
      description: Addresses and the serial number are hidden by default (do not use `--show-address`). Read again before you paste · Adresses et numéro de série sont masqués par défaut. Relisez avant de coller.
      render: text
    validations:
      required: true
  - type: textarea
    id: remarques
    attributes:
      label: Notes · Remarques
      description: What works or not when reading, messages shown · Ce qui fonctionne ou non en lecture, messages affichés.
