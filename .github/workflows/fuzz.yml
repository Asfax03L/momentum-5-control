name: Fuzzing des décodeurs

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependances:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fuzz/Cargo.toml
          arguments: --config deny.toml --locked
          command: check

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    # La nightly ne s'applique qu'à cette tâche, pas à la CI stable.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-22
          components: rust-src, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Quatre cibles, sans casque
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          seconds=600
          if [ "$EVENT_NAME" = pull_request ]; then seconds=60; fi
          sh fuzz/lancer.sh "$seconds"
      - name: Journaux et cas à reproduire
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ github.run_id }}
          path: |
            fuzz/logs/
            fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
