name: Flatpak

# Paquet Flatpak (client KDE, service, ctl) construit dans l'environnement
# KDE de Flathub. À chaque PR et sur main : paquet en artefact. Sur une
# étiquette « v* » : joint aussi à la publication créée par release.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: openheadset-control.flatpak
          manifest-path: packaging/flatpak/org.openheadset.Control.yml
          cache-key: flatpak-builder-${{ github.sha }}

  publication:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openheadset-control-x86_64
      - name: Joindre à la publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name="openheadset-control-${{ github.ref_name }}-x86_64.flatpak"
          mv openheadset-control.flatpak "$name"
          sha256sum "$name" | cut -d' ' -f1 > "$name.sha256"
          # La publication est créée par release.yml : l'attendre.
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "${{ github.ref_name }}" "$name" "$name.sha256" --clobber
