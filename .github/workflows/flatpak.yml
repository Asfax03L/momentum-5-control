name: Flatpak

# Paquet Flatpak (client KDE, service, ctl) construit dans l'environnement
# KDE de Flathub, à chaque PR et sur main (paquet en artefact). Pour une
# étiquette « v* », c'est release.yml qui le construit et le publie avec
# les autres paquets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: openheadset-control.flatpak
          manifest-path: packaging/flatpak/org.openheadset.Control.yml
          cache-key: flatpak-builder-${{ github.sha }}
