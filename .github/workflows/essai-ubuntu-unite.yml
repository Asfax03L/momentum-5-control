name: Essai temporaire (unité sur Ubuntu)

# Mesure, sur Ubuntu 24.04 (AppArmor restreint les espaces de noms
# utilisateur), quelles options de durcissement laissent démarrer un
# service utilisateur. Retiré avant la fusion.
on:
  push:
    branches: [version-0.15.1]

permissions:
  contents: read

jobs:
  variantes:
    runs-on: ubuntu-24.04
    steps:
      - name: Variantes
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          systemd --version | head -1
          mkdir -p "$HOME/.local/share/momentum-ctl-win" "$HOME/Documents"
          D="$HOME/.local/share/momentum-ctl-win"
          base="-p NoNewPrivileges=yes -p RestrictAddressFamilies=AF_UNIX\ AF_BLUETOOTH -p RestrictRealtime=yes -p RestrictSUIDSGID=yes -p LockPersonality=yes -p MemoryDenyWriteExecute=yes -p SystemCallArchitectures=native -p SystemCallFilter=@system-service -p UMask=0077"
          essai() {
            nom=$1; shift
            if eval systemd-run --user --wait --pipe --quiet "$@" -- /bin/sh -c "'cat $HOME/.bashrc >/dev/null 2>&1 && echo lit-le-home || echo home-masque'" > sortie.txt 2>&1; then
              echo "OK      $nom : $(cat sortie.txt)"
            else
              echo "ÉCHEC   $nom : $(tail -1 sortie.txt)"
            fi
          }
          test -f "$HOME/.bashrc" || echo "# témoin" > "$HOME/.bashrc"
          essai "sans options" ""
          essai "base (sans espaces de noms)" "$base"
          essai "base + CapabilityBoundingSet vide" "$base -p CapabilityBoundingSet="
          essai "base + ProtectSystem=strict" "$base -p ProtectSystem=strict -p ReadWritePaths=$D"
          essai "base + ProtectHome=read-only" "$base -p ProtectHome=read-only"
          essai "base + ProtectHome=tmpfs" "$base -p ProtectHome=tmpfs -p BindPaths=$D -p BindPaths=$XDG_RUNTIME_DIR/bus"
          essai "base + PrivateTmp" "$base -p PrivateTmp=yes"
          essai "base + PrivateDevices" "$base -p PrivateDevices=yes"
          essai "base + noyau" "$base -p ProtectKernelTunables=yes -p ProtectKernelModules=yes -p ProtectKernelLogs=yes -p ProtectControlGroups=yes -p ProtectClock=yes"
          essai "base + ProtectProc" "$base -p ProtectProc=invisible -p ProcSubset=pid"
          essai "base + RestrictNamespaces" "$base -p RestrictNamespaces=yes"
          essai "unité 0.15.1 sans les 3 groupes refusés" "$base -p ProtectSystem=strict -p ProtectHome=tmpfs -p BindPaths=$D -p BindPaths=$XDG_RUNTIME_DIR/bus -p PrivateTmp=yes -p ProtectProc=invisible -p ProcSubset=pid -p RestrictNamespaces=yes -p ProtectHostname=yes"
          sudo journalctl -k --no-pager | grep -i apparmor | grep -i denied | tail -10 || true
