name: Paquets Linux natifs

on:
  pull_request:
    paths:
      - ".github/workflows/paquets-linux.yml"
      - ".github/workflows/release.yml"
      - "packaging/deb/**"
      - "packaging/rpm/**"
      - "packaging/linux/**"
      - "packaging/aur/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "frontends/kirigami/**"
      - "assets/linux/**"
      - "assets/logo/**"
      - "plasma/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Version publiée précédente : mise à jour par-dessus.
  PRECEDENTE: v0.13.0
  GH_TOKEN: ${{ github.token }}

jobs:
  deb:
    name: Debian 13 et Ubuntu 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Environnement Debian 13
        run: docker build -t ohc-deb -f packaging/deb/Containerfile packaging/deb
      - name: Construction du paquet
        run: docker run --rm -v "$PWD:/src" ohc-deb sh packaging/linux/construire.sh deb
      - name: Installation et retrait dans deux systèmes propres
        run: |
          package=$(find target/paquets/deb -name '*.deb')
          test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          # Mise à jour par-dessus la version publiée précédente.
          gh release download "$PRECEDENTE" -p '*_amd64.deb' -D precedente
          previous=$(find precedente -name '*.deb')
          for image in debian:13 ubuntu:26.04; do
            docker run --rm -v "$PWD:/src:ro" -w /src "$image" \
              sh packaging/linux/verifier-installation.sh deb "/src/$package" "/src/$previous"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb
          path: target/paquets/deb/*.deb*
          if-no-files-found: error

  rpm:
    name: Fedora 43 et 44
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Environnement Fedora 43
        run: docker build -t ohc-rpm -f packaging/rpm/Containerfile packaging/rpm
      - name: Construction du paquet
        run: docker run --rm -v "$PWD:/src" ohc-rpm sh packaging/linux/construire.sh rpm
      - name: Installation et retrait dans deux systèmes propres
        run: |
          package=$(find target/paquets/rpm -name '*.rpm')
          test "$(printf '%s\n' "$package" | wc -l)" -eq 1
          gh release download "$PRECEDENTE" -p '*.x86_64.rpm' -D precedente
          previous=$(find precedente -name '*.rpm')
          for version in 43 44; do
            docker run --rm -v "$PWD:/src:ro" -w /src "registry.fedoraproject.org/fedora:$version" \
              sh packaging/linux/verifier-installation.sh rpm "/src/$package" "/src/$previous"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rpm
          path: target/paquets/rpm/*.rpm*
          if-no-files-found: error

  arch:
    name: Arch Linux (AUR)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: makepkg, namcap, installation et retrait
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p target/aur-source
          # Même forme que l'archive d'une étiquette GitHub.
          git archive --prefix="openheadset-control-$version/" -o target/aur-source/source.tar.gz HEAD
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest \
            sh packaging/aur/essai-arch.sh "$version" target/aur-source/source.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aur
          path: target/paquets/aur/
          if-no-files-found: error
