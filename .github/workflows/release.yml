name: Publication

# Pousser une étiquette « v0.9.0 » (par exemple) construit et teste chaque
# paquet, puis publie tout d'un coup (F09 de la revue) : rien n'est visible
# tant qu'un paquet manque. Paquets prêts à installer sans Rust :
#   - Windows : WinUI 3, service, ctl, probe et installer.ps1 ;
#   - Linux : client KDE, service, ctl, widget Plasma et installer-linux.sh ;
#   - Flatpak : client KDE, service et ctl ;
#   - paquets .deb et .rpm ;
#   - inventaire des dépendances (SBOM CycloneDX).
# Chaque fichier est accompagné de son empreinte SHA-256 et d'une
# attestation de provenance GitHub (docs/VERIFIER.md).
on:
  push:
    tags: ["v*"]
  # Essai à blanc : tout est construit, empreint et attesté, mais aucune
  # publication n'est créée.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # L'étiquette doit correspondre à la version de l'espace de travail.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Étiquette et version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml : $version ; étiquette : ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked --bins
      - name: Archive
        shell: pwsh
        run: |
          $dir = "openheadset-control-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/momentum-winui.exe, target/release/momentum-daemon.exe, target/release/ctl.exe, target/release/probe.exe $dir
          Copy-Item scripts/installer.ps1, README.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: openheadset-control-*-windows-x86_64.zip
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      QMAKE: /usr/bin/qmake6
    steps:
      - uses: actions/checkout@v7
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - run: sudo apt-get update && sudo apt-get install -y dbus-daemon libdbus-1-dev pkg-config qt6-base-dev qt6-declarative-dev qmake6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked -p momentum-cli -p momentum-daemon -p momentum-kirigami
      - name: Archive
        run: |
          dir="openheadset-control-${{ github.ref_name }}-linux-x86_64"
          mkdir -p "$dir/assets"
          cp target/release/ctl target/release/momentum-daemon target/release/momentum-kirigami "$dir/"
          cp -r assets/linux assets/logo "$dir/assets/"
          cp -r plasma "$dir/"
          cp scripts/installer-linux.sh README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          mkdir -p "$dir/man" "$dir/completions"
          target/release/ctl man > "$dir/man/ctl.1"
          target/release/ctl completions bash > "$dir/completions/ctl.bash"
          target/release/ctl completions zsh > "$dir/completions/_ctl"
          target/release/ctl completions fish > "$dir/completions/ctl.fish"
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: openheadset-control-*-linux-x86_64.tar.gz
          if-no-files-found: error

  flatpak:
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: openheadset-control-${{ github.ref_name }}-x86_64.flatpak
          manifest-path: packaging/flatpak/org.openheadset.Control.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: openheadset-control-*-x86_64.flatpak
          if-no-files-found: error

  paquets:
    needs: version
    uses: ./.github/workflows/paquets-linux.yml

  # Inventaire des dépendances de chaque paquet Rust de l'espace de travail
  # (toutes cibles : Windows et Linux), au format CycloneDX 1.5.
  sbom:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: SBOM CycloneDX
        run: |
          cargo cyclonedx --format json --target all --spec-version 1.5 --no-build-deps
          dir="openheadset-control-${{ github.ref_name }}-sbom-cyclonedx"
          mkdir "$dir"
          for f in crates/*/*.cdx.json frontends/*/*.cdx.json; do
            # Identifiants relatifs au dépôt, sans le dossier du runner.
            sed "s#path+file://$GITHUB_WORKSPACE#path+file://.#g" "$f" > "$dir/$(basename "$f")"
          done
          test "$(ls "$dir" | wc -l)" -ge 6
          ! grep -l "$GITHUB_WORKSPACE" "$dir"/*
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: openheadset-control-*-sbom-cyclonedx.tar.gz
          if-no-files-found: error

  # Publication unique, seulement si tous les paquets sont prêts : créée en
  # brouillon avec tous les fichiers, vérifiée, puis rendue publique.
  publication:
    needs: [windows, linux, flatpak, paquets, sbom]
    runs-on: ubuntu-24.04
    # Attestations de provenance : jeton OIDC et écriture des attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # CHANGELOG.md et le script des notes de publication.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: paquets
          merge-multiple: true
      - name: Empreintes et vérification
        working-directory: paquets
        run: |
          ls -la
          set -- ./*.zip ./*.tar.gz ./*.flatpak ./*.deb ./*.rpm
          # Archive Windows, archive Linux, SBOM, Flatpak, .deb, .rpm.
          test "$#" -eq 6
          for f do
            test -s "$f"
            # Format de `sha256sum -c` : empreinte, deux espaces, nom.
            sha256sum "${f#./}" > "$f.sha256"
          done
      # Provenance signée par GitHub (Sigstore) : quel dépôt, quel workflow et
      # quelle révision ont produit chaque fichier.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            paquets/*.zip
            paquets/*.tar.gz
            paquets/*.flatpak
            paquets/*.deb
            paquets/*.rpm
      - name: Publication
        if: github.event_name == 'push'
        working-directory: paquets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Notes détaillées : nouveautés du CHANGELOG, actions après la mise
          # à jour, installation pas à pas avec les noms exacts des fichiers.
          # Sans section du CHANGELOG pour cette version, rien n'est publié.
          python3 ../scripts/notes-publication.py "${GITHUB_REF_NAME}" . > ../notes.md
          gh release create "${GITHUB_REF_NAME}" --draft \
            --title "OpenHeadset Control ${GITHUB_REF_NAME}" \
            --notes-file ../notes.md \
            ./*
          # Tous les fichiers sont bien attachés avant de rendre public.
          count=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')
          test "$count" -eq 12
          gh release edit "${GITHUB_REF_NAME}" --draft=false
