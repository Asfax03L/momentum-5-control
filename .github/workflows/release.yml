name: Publication

# Pousser une étiquette « v0.9.0 » (par exemple) construit et teste chaque
# paquet, puis publie tout d'un coup (F09 de la revue) : rien n'est visible
# tant qu'un paquet manque. Paquets prêts à installer sans Rust :
#   - Windows : installateur (Inno Setup), et archive avec WinUI 3,
#     service, ctl, probe et installer.ps1 ;
#   - Linux : client KDE, service, ctl, widget Plasma et installer-linux.sh ;
#   - Flatpak : client KDE, service et ctl ;
#   - paquets .deb et .rpm ; widget Plasma seul (.plasmoid) ;
#   - extension Decky Loader pour le mode jeu (.zip) ;
#   - inventaire des dépendances (SBOM CycloneDX).
# Chaque fichier est accompagné de son empreinte SHA-256 et d'une
# attestation de provenance GitHub (docs/VERIFIER.md).
on:
  push:
    tags: ["v*"]
  # Essai à blanc : tout est construit, empreint et attesté, mais aucune
  # publication n'est créée.
  workflow_dispatch:

# Lecture seule par défaut ; seul le job « publication » écrit (A07 de
# l'audit du 24/10/2026).
permissions:
  contents: read

jobs:
  # L'étiquette doit correspondre à la version de l'espace de travail, et la
  # CI complète (workflow CI : confidentialité, dépendances, couverture,
  # essais d'interface…) doit être verte sur cette même révision.
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Étiquette et version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml : $version ; étiquette : ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: CI verte sur cette révision
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # La CI de main tourne pour ce commit (fusion) ; attendre sa fin
          # (60 min au plus), puis exiger un succès.
          for i in $(seq 1 120); do
            etat=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion \
              --jq 'map(select(.status == "completed")) | if length == 0 then "attente" else (.[0].conclusion) end')
            echo "CI de $GITHUB_SHA : $etat"
            case "$etat" in
              success) exit 0 ;;
              attente) sleep 30 ;;
              *) echo "CI en échec sur cette révision : rien n'est publié." >&2; exit 1 ;;
            esac
          done
          echo "CI introuvable ou trop longue pour $GITHUB_SHA : rien n'est publié." >&2
          exit 1

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked
      - run: cargo build --release --locked --bins
      - name: Archive
        shell: pwsh
        run: |
          $dir = "openheadset-control-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/momentum-winui.exe, target/release/momentum-daemon.exe, target/release/ctl.exe, target/release/probe.exe $dir
          Copy-Item scripts/installer.ps1, README.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      # Installateur par utilisateur (Inno Setup), essayé en silencieux :
      # installation, réinstallation, désinstallation (sans runtime sur le
      # runner : l'interface n'y est pas lancée).
      - name: Installateur
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches.Groups[1].Value
          ./packaging/windows/construire-installateur.ps1 -Version $version -Bin target/release -Sortie .
          ./scripts/essai-installateur-windows.ps1 -Installateur "openheadset-control-v$version-windows-x86_64-installateur.exe" -Version $version -SansRuntime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: |
            openheadset-control-*-windows-x86_64.zip
            openheadset-control-*-windows-x86_64-installateur.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      QMAKE: /usr/bin/qmake6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - run: sudo apt-get update && sudo apt-get install -y dbus-daemon libdbus-1-dev pkg-config qt6-base-dev qt6-declarative-dev qmake6 libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked
      - run: cargo build --release --locked -p momentum-cli -p momentum-daemon -p momentum-kirigami -p momentum-gtk
      - name: Archive
        run: |
          dir="openheadset-control-${{ github.ref_name }}-linux-x86_64"
          mkdir -p "$dir/assets"
          cp target/release/ctl target/release/momentum-daemon target/release/momentum-kirigami target/release/momentum-gtk "$dir/"
          cp -r assets/linux assets/logo "$dir/assets/"
          cp -r plasma "$dir/"
          cp scripts/installer-linux.sh README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          # Exécutable, comme l'indiquent les notes (./installer-linux.sh).
          chmod 755 "$dir/installer-linux.sh"
          mkdir -p "$dir/man" "$dir/completions"
          target/release/ctl man > "$dir/man/ctl.1"
          target/release/ctl completions bash > "$dir/completions/ctl.bash"
          target/release/ctl completions zsh > "$dir/completions/_ctl"
          target/release/ctl completions fish > "$dir/completions/ctl.fish"
          tar -czf "$dir.tar.gz" "$dir"
          tar -tvzf "$dir.tar.gz" "$dir/installer-linux.sh" | grep -q '^-rwxr-xr-x'
          # Widget Plasma seul (KDE Store, kpackagetool6 -i) : métadonnées à
          # la racine de l'archive.
          (cd plasma/org.openheadset.control.plasmoid && zip -qrX "../../openheadset-control-${{ github.ref_name }}.plasmoid" .)
          unzip -l "openheadset-control-${{ github.ref_name }}.plasmoid" | grep -q ' metadata.json$'
          # Extension Decky Loader (mode jeu).
          sh decky/empaqueter.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            openheadset-control-*-linux-x86_64.tar.gz
            openheadset-control-*.plasmoid
            openheadset-control-*-decky.zip
          if-no-files-found: error

  # Même construction que les PR (sources figées, sans réseau, contrôle de
  # Flathub), sous le nom du fichier publié.
  flatpak:
    needs: version
    uses: ./.github/workflows/flatpak.yml
    with:
      bundle: openheadset-control-${{ github.ref_name }}-x86_64.flatpak

  paquets:
    needs: version
    uses: ./.github/workflows/paquets-linux.yml

  # Inventaire des dépendances de chaque paquet Rust de l'espace de travail
  # (toutes cibles : Windows et Linux), au format CycloneDX 1.5.
  sbom:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: SBOM CycloneDX
        run: |
          cargo cyclonedx --format json --target all --spec-version 1.5 --no-build-deps
          dir="openheadset-control-${{ github.ref_name }}-sbom-cyclonedx"
          mkdir "$dir"
          for f in crates/*/*.cdx.json frontends/*/*.cdx.json; do
            # Identifiants relatifs au dépôt, sans le dossier du runner.
            sed "s#path+file://$GITHUB_WORKSPACE#path+file://.#g" "$f" > "$dir/$(basename "$f")"
          done
          test "$(ls "$dir" | wc -l)" -ge 6
          ! grep -l "$GITHUB_WORKSPACE" "$dir"/*
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: openheadset-control-*-sbom-cyclonedx.tar.gz
          if-no-files-found: error

  # Publication unique, seulement si tous les paquets sont prêts : créée en
  # brouillon avec tous les fichiers, vérifiée, puis rendue publique.
  publication:
    needs: [windows, linux, flatpak, paquets, sbom]
    runs-on: ubuntu-24.04
    # Attestations de provenance : jeton OIDC et écriture des attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # CHANGELOG.md et le script des notes de publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: paquets
          merge-multiple: true
      - name: Empreintes et vérification
        working-directory: paquets
        run: |
          # Sources du Flatpak et PKGBUILD de l'essai Arch : servent à la
          # construction, pas publiés.
          rm -f cargo-sources.json PKGBUILD .SRCINFO
          ls -la
          set -- ./*.zip ./*.exe ./*.tar.gz ./*.flatpak ./*.deb ./*.rpm ./*.plasmoid
          # Archive et installateur Windows, extension Decky, archive Linux,
          # SBOM, Flatpak, .deb, .rpm, widget Plasma.
          test "$#" -eq 9
          for f do
            test -s "$f"
            # Format de `sha256sum -c` : empreinte, deux espaces, nom.
            sha256sum "${f#./}" > "$f.sha256"
          done
      # Provenance signée par GitHub (Sigstore) : quel dépôt, quel workflow et
      # quelle révision ont produit chaque fichier.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            paquets/*.zip
            paquets/*.exe
            paquets/*.tar.gz
            paquets/*.flatpak
            paquets/*.deb
            paquets/*.rpm
            paquets/*.plasmoid
      - name: Publication
        if: github.event_name == 'push'
        working-directory: paquets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Notes détaillées : nouveautés du CHANGELOG, actions après la mise
          # à jour, installation pas à pas avec les noms exacts des fichiers.
          # Sans section du CHANGELOG pour cette version, rien n'est publié.
          python3 ../scripts/notes-publication.py "${GITHUB_REF_NAME}" . > ../notes.md
          gh release create "${GITHUB_REF_NAME}" --draft \
            --title "OpenHeadset Control ${GITHUB_REF_NAME}" \
            --notes-file ../notes.md \
            ./*
          # Tous les fichiers sont bien attachés avant de rendre public.
          count=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')
          test "$count" -eq 18
          gh release edit "${GITHUB_REF_NAME}" --draft=false
