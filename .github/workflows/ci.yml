name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Rien de personnel ni de confidentiel dans ce dépôt public.
  confidentialite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/verifier-confidentialite.sh

  # Dépendances : failles connues (RustSec), licences, provenance (deny.toml).
  dependances:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Version de travail (rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Démarrage réel de WinUI (F13) : runtime installé, mode démonstration ;
  # la fenêtre doit toujours tourner après 20 s (pas de plantage au
  # chargement).
  winui-demarrage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p momentum-winui
      - name: Windows App Runtime 2
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/2.0/latest/windowsappruntimeinstall-x64.exe -OutFile runtime.exe
          Start-Process ./runtime.exe -ArgumentList '--quiet' -Wait
          Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.2*' | Select-Object Name, Version
      - name: Démarrage de WinUI (démonstration)
        shell: pwsh
        run: |
          foreach ($page in @('accueil', 'son', 'scenes', 'reglages')) {
            $p = Start-Process target\debug\momentum-winui.exe -ArgumentList '--demo', '--page', $page -PassThru -RedirectStandardError "winui-$page.log"
            try {
              Start-Sleep 20
              Get-Content "winui-$page.log" -ErrorAction SilentlyContinue
              if ($p.HasExited) { throw "WinUI s'est arrêté sur $page (code $($p.ExitCode))" }
              "WinUI : page $page toujours ouverte après 20 s."
            } finally {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
              $p.WaitForExit()
            }
          }
      # Budget de ressources (docs/RESSOURCES.md) : version release, 30 s au
      # repos, seuils larges.
      - run: cargo build --release --locked -p momentum-winui
      - name: Ressources de WinUI (démonstration)
        shell: pwsh
        run: ./scripts/mesurer-ressources.ps1 -Binaires target/release -Duree 30

      # Essai de l'interface par UI Automation (démonstration) : chaque page
      # par la navigation, puis un réglage simulé relu à l'affichage.
      - name: Essai de l'interface WinUI (UI Automation)
        shell: pwsh
        run: ./scripts/essai-interface-winui.ps1 -Exe target/debug/momentum-winui.exe
      # Installateur Windows (Inno Setup) : mise à jour par-dessus la
      # version publiée précédente (installer.ps1), réinstallation, puis
      # désinstallation propre.
      - run: cargo build --release --locked -p momentum-daemon -p momentum-cli
      - name: Installateur Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches.Groups[1].Value
          ./packaging/windows/construire-installateur.ps1 -Version $version -Bin target/release -Sortie installateur
          gh release download v0.13.0 -p '*-windows-x86_64.zip' -D precedente
          Expand-Archive precedente/*.zip -DestinationPath precedente
          ./scripts/essai-installateur-windows.ps1 -Installateur "installateur/openheadset-control-v$version-windows-x86_64-installateur.exe" -Version $version -Precedente precedente/openheadset-control-v0.13.0-windows-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: installateur-windows
          path: installateur/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capture-essai-interface-winui
          path: essai-interface-winui.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    env:
      # Sans informations de débogage : avec Qt et zbus, le dossier target
      # remplit vite le disque du runner.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # Outils préinstallés inutiles ici (Android, .NET) : environ 10 Go.
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet && df -h /
      - run: sudo apt-get update && sudo apt-get install -y dbus-daemon libdbus-1-dev pkg-config qt6-base-dev qt6-declarative-dev qmake6 libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Client Kirigami : hors des membres par défaut (Qt 6 requis).
      - run: cargo clippy -p momentum-kirigami --all-targets -- -D warnings
        env:
          QMAKE: /usr/bin/qmake6
      - run: cargo test --locked -p momentum-kirigami
        env:
          QMAKE: /usr/bin/qmake6
      # Client GTK : hors des membres par défaut (GTK 4.14 et libadwaita
      # 1.5 d'Ubuntu 24.04, comme l'archive publiée).
      - run: cargo clippy -p momentum-gtk --all-targets -- -D warnings
      - run: cargo build --release -p momentum-cli -p momentum-daemon -p momentum-kirigami -p momentum-gtk
        env:
          QMAKE: /usr/bin/qmake6
      - uses: actions/upload-artifact@v7
        with:
          name: openheadset-linux-x86_64
          path: |
            target/release/ctl
            target/release/momentum-daemon
            target/release/momentum-kirigami
            target/release/momentum-gtk
          if-no-files-found: error

  # Client GNOME (GTK 4, libadwaita) récent (Fedora 44) : compilation et
  # essai de l'interface en démonstration, sans écran (Broadway).
  gnome:
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc pkgconf-pkg-config dbus-devel gtk4-devel libadwaita-devel rust cargo clippy dbus-daemon
      - uses: actions/checkout@v7
      - run: cargo clippy -p momentum-gtk --all-targets -- -D warnings
      - name: Essai de l'interface GNOME
        run: |
          cargo build -p momentum-gtk
          gtk4-broadwayd :5 &
          sleep 1
          set +e
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 timeout 60 dbus-run-session -- \
            target/debug/momentum-gtk --demo --essai-interface > essai-interface.log 2>&1
          code=$?
          set -e
          cat essai-interface.log
          test "$code" -eq 0
          grep -q "ESSAI INTERFACE RÉUSSI" essai-interface.log

  # Client KDE avec un Qt récent (Fedora 44 : Qt 6.11, comme Bazzite) : le
  # code réservé à Qt 6.8 et plus (thème clair ou sombre) n'est compilé
  # qu'ici, la tâche Ubuntu ayant Qt 6.4.
  kde-qt-recent:
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      QMAKE: /usr/bin/qmake6
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc gcc-c++ pkgconf-pkg-config dbus-devel qt6-qtbase-devel qt6-qtdeclarative-devel rust cargo clippy kf6-kirigami kf6-qqc2-desktop-style dbus-daemon
      - uses: actions/checkout@v7
      - run: qmake6 -query QT_VERSION && cargo --version
      - run: cargo clippy -p momentum-kirigami --all-targets -- -D warnings
      # Démarrage réel (F13) : mode démonstration, sans écran, sur un bus de
      # session à part ; le QML et ses modules Kirigami doivent se charger
      # sans erreur. Le client tourne jusqu'à la fin du délai (code 124).
      - name: Démarrage du client KDE (QML)
        run: |
          cargo build -p momentum-kirigami
          for page in accueil son scenes reglages audio; do
            set +e
            QT_QPA_PLATFORM=offscreen timeout 15 dbus-run-session -- \
              target/debug/momentum-kirigami --demo --page "$page" > "demarrage-$page.log" 2>&1
            code=$?
            set -e
            cat "demarrage-$page.log"
            test "$code" -eq 124
            ! grep -E "qrc:.*(Error|error)|is not a type|is not installed|ReferenceError|TypeError|Cannot assign" "demarrage-$page.log"
          done
      # Essai de l'interface (démonstration) : chaque page se charge, un
      # réglage simulé change l'affichage, le panneau rapide s'ouvre.
      - name: Essai de l'interface KDE
        run: |
          set +e
          # Messages de QML sur la sortie d'erreur (sinon vers journald).
          QT_FORCE_STDERR_LOGGING=1 QT_QPA_PLATFORM=offscreen timeout 90 dbus-run-session -- \
            target/debug/momentum-kirigami --demo --essai-interface > essai-interface.log 2>&1
          code=$?
          set -e
          cat essai-interface.log
          test "$code" -eq 0
          grep -q "ESSAI INTERFACE RÉUSSI" essai-interface.log

  # Service durci (assets/linux/momentum-daemon.service, docs/SECURITE.md) :
  # score d'exposition de systemd, puis démarrage réel du service compilé,
  # sans casque, sur un bus de session privé.
  service-durci:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openheadset-linux-x86_64
          path: bin
      - name: Score d'exposition (systemd-analyze)
        run: |
          systemd-analyze --version | head -1
          systemd-analyze security --offline=yes --user assets/linux/momentum-daemon.service | tee securite.txt
          score=$(grep -oE 'exposure level for [^:]+: [0-9.]+' securite.txt | grep -oE '[0-9.]+$')
          echo "Service durci : exposition $score sur 10 (systemd-analyze security)" >> "$GITHUB_STEP_SUMMARY"
          # Seuil large : 1,5 relevé sur Bazzite (systemd 259) le 23/10/2026 ;
          # 9,4 avant le durcissement.
          awk -v s="$score" 'BEGIN { exit !(s <= 2.5) }'
      - name: Démarrage sans casque sur un bus privé
        run: |
          sudo apt-get update && sudo apt-get install -y dbus-daemon
          chmod +x bin/momentum-daemon
          dbus-run-session -- sh -c '
            bin/momentum-daemon > daemon.log 2>&1 &
            sleep 5
            busctl --user call org.openheadset.Control /org/openheadset/Control org.openheadset.Control1 Snapshot
          '
          cat daemon.log
          grep -q "service OpenHeadset Control prêt" daemon.log

  # Budget de ressources (docs/RESSOURCES.md) : service sans casque et
  # client KDE en démonstration, version release, 30 s au repos.
  ressources:
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      QMAKE: /usr/bin/qmake6
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc gcc-c++ pkgconf-pkg-config dbus-devel qt6-qtbase-devel qt6-qtdeclarative-devel rust cargo kf6-kirigami kf6-qqc2-desktop-style dbus-daemon
      - uses: actions/checkout@v7
      - run: cargo build --release --locked -p momentum-daemon -p momentum-kirigami
      - name: Relevé
        # bash : pipefail, un dépassement de seuil fait échouer l'étape.
        shell: bash
        run: |
          sh scripts/mesurer-ressources.sh target/release 30 | tee releve.md
          grep -E "^(\||Relevé)" releve.md >> "$GITHUB_STEP_SUMMARY"

  # Couverture des tests (cargo-llvm-cov, sans service tiers) : résumé dans
  # l'onglet Summary, seuil sur le cœur du protocole (trames, messages, SDP).
  couverture:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y dbus-daemon libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --locked --json --summary-only --output-path couverture.json
      - name: Résumé et seuil du protocole
        run: |
          python3 - <<'PY'
          import json, os
          files = json.load(open("couverture.json"))["data"][0]["files"]
          total = json.load(open("couverture.json"))["data"][0]["totals"]["lines"]
          protocol = [f for f in files
                      if "/momentum-core/src/protocol/" in f["filename"]
                      or f["filename"].endswith("/momentum-core/src/sdp.rs")]
          count = sum(f["summary"]["lines"]["count"] for f in protocol)
          covered = sum(f["summary"]["lines"]["covered"] for f in protocol)
          percent = 100 * covered / count
          lines = ["| Fichier | Lignes couvertes |", "|---|---|"]
          for f in protocol:
              name = f["filename"].split("/momentum-core/src/")[1]
              lines.append(f"| {name} | {f['summary']['lines']['percent']:.1f} % |")
          lines.append(f"| **protocole et SDP** | **{percent:.1f} %** |")
          lines.append(f"| espace de travail | {total['percent']:.1f} % |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Couverture des tests\n\n" + "\n".join(lines) + "\n")
          print("\n".join(lines))
          # Seuil : valeur du 23/10/2026 (82,6 % sous Windows) moins 2 points,
          # arrondie à l'unité inférieure.
          if percent < 80:
              raise SystemExit(f"couverture du protocole {percent:.1f} % < 80 %")
          PY

  # Version minimale de Rust annoncée (rust-version) : 1.89 pour l'ensemble,
  # 1.95 pour l'interface WinUI, 1.92 pour le client GTK (gtk-rs ; tâche
  # gnome, sur Fedora). RUSTUP_TOOLCHAIN passe outre
  # rust-toolchain.toml (version de travail).
  msrv:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            rust: "1.89"
            # WinUI (1.95) ne se compile pas sous Linux ; Kirigami et GTK :
            # tâches à part (bibliothèques du système).
            args: --workspace --exclude momentum-winui --exclude momentum-kirigami --exclude momentum-gtk
          - os: windows-latest
            rust: "1.95"
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: rustc --version && cargo check --locked ${{ matrix.args }}
