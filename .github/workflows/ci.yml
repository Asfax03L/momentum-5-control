name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux:
    runs-on: ubuntu-24.04
    env:
      # Sans informations de débogage : avec Slint, Qt et zbus, le dossier
      # target remplissait le disque du runner.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # Outils préinstallés inutiles ici (Android, .NET) : environ 10 Go.
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet && df -h /
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libgtk-3-dev libxdo-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev qt6-base-dev qt6-declarative-dev qmake6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Client Kirigami : hors des membres par défaut (Qt 6 requis).
      - run: cargo clippy -p momentum-kirigami --all-targets -- -D warnings
        env:
          QMAKE: /usr/bin/qmake6
      - run: cargo build --release -p momentum-cli -p momentum-tray -p momentum-kirigami
        env:
          QMAKE: /usr/bin/qmake6
      - uses: actions/upload-artifact@v4
        with:
          name: openheadset-linux-x86_64
          path: |
            target/release/ctl
            target/release/momentum-tray
            target/release/momentum-kirigami
          if-no-files-found: error
