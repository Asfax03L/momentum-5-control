[package]
name = "openheadset-control-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
momentum-core = { path = "../crates/momentum-core" }

# Espace de travail indépendant : aucun fuzzing dans cargo test/build.
[workspace]
resolver = "3"
members = ["."]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_stream"
path = "fuzz_targets/frame_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdp_element"
path = "fuzz_targets/sdp_element.rs"
test = false
doc = false
bench = false

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false
