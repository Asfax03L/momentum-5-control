# Flatpak d'OpenHeadset Control (Linux, KDE Plasma ; pensé pour Bazzite) :
# client KDE (momentum-kirigami), service (momentum-daemon, lancé par
# activation D-Bus) et ctl.
#
# Construction locale, depuis la racine du dépôt :
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/org.openheadset.Control.yml
# La CI construit le même manifeste et publie le paquet (.flatpak).
#
# Les dépendances Rust sont téléchargées pendant la construction (réseau
# autorisé) : simple pour un paquet du projet ; Flathub demanderait une liste
# de sources figée (flatpak-cargo-generator).
id: org.openheadset.Control
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: momentum-kirigami
finish-args:
  # Fenêtre (Wayland natif, X11 en secours) et rendu.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Instantané PipeWire du système (aucune commande de modification).
  # Le suffixe :ro ne transforme pas le protocole du socket en lecture seule.
  - --filesystem=xdg-run/pipewire-0:ro
  # Casque : sockets Bluetooth (RFCOMM) et BlueZ sur le bus système.
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  # Instance unique de la fenêtre (le service porte l'identifiant de l'app).
  - --own-name=org.openheadset.ControlWindow
  # Icône de la zone de notification : l'élément s'enregistre sous
  # « org.kde.StatusNotifierItem-<pid>-<n> », que Flatpak ne sait désigner
  # que par org.kde.* (usage courant sur Flathub pour ces icônes).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*
  # Raccourcis globaux KDE et notifications du service.
  - --talk-name=org.kde.kglobalaccel
  - --talk-name=org.freedesktop.Notifications
  # Exports (batterie en CSV, profil) dans Documents.
  - --filesystem=xdg-documents
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/openheadset-control/cargo
modules:
  - name: openheadset-control
    buildsystem: simple
    build-commands:
      - QMAKE="$(command -v qmake6 || command -v qmake)" cargo build --release --locked -p momentum-kirigami -p momentum-daemon -p momentum-cli
      - sh packaging/flatpak/installer-flatpak.sh
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build-flatpak
          - .flatpak-builder
