# Flatpak d'OpenHeadset Control (Linux, KDE Plasma ; pensé pour Bazzite) :
# client KDE (momentum-kirigami), service (momentum-daemon, lancé par
# activation D-Bus) et ctl.
#
# Construction locale, depuis la racine du dépôt (docs/LINUX.md) :
#   sh packaging/flatpak/sources-cargo.sh
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.asfax03l.OpenHeadsetControl.yml
# La CI construit le même manifeste et publie le paquet (.flatpak).
#
# Sources figées : la construction se fait sans réseau. Les dépendances
# Rust viennent de cargo-sources.json, produit depuis Cargo.lock par
# sources-cargo.sh (empreinte SHA-256 de chaque crate). Le manifeste pour
# Flathub ne diffère que par la source du dépôt (docs/FLATHUB.md).
id: io.github.asfax03l.OpenHeadsetControl
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: momentum-kirigami
finish-args:
  # Fenêtre (Wayland natif, X11 en secours) et rendu.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Instantané PipeWire du système (aucune commande de modification).
  # Le suffixe :ro ne transforme pas le protocole du socket en lecture seule.
  - --filesystem=xdg-run/pipewire-0:ro
  # Casque : sockets Bluetooth (RFCOMM) et BlueZ sur le bus système.
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  # API du service (widget Plasma, ctl, scripts) : même nom D-Bus que les
  # autres installations. Fenêtre unique : nom propre à la fenêtre.
  - --own-name=org.openheadset.Control
  - --own-name=org.openheadset.ControlWindow
  # Icône de la zone de notification, inscrite sous le nom unique de la
  # connexion (aucun nom org.kde.* à posséder).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Raccourcis globaux KDE et notifications du service.
  - --talk-name=org.kde.kglobalaccel
  - --talk-name=org.freedesktop.Notifications
  # Exports (batterie en CSV, profil, réglages) et import des réglages,
  # dans Documents.
  - --filesystem=xdg-documents
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/openheadset-control/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: openheadset-control
    buildsystem: simple
    build-commands:
      - QMAKE="$(command -v qmake6 || command -v qmake)" cargo build --release --locked --offline -p momentum-kirigami -p momentum-daemon -p momentum-cli
      - sh packaging/flatpak/installer-flatpak.sh
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build-flatpak
          - .flatpak-builder
          - repo
      # Produit par sources-cargo.sh, non versionné.
      - cargo-sources.json
