[package]
name = "momentum-core"
description = "Protocole GAIA, casque, scènes et modèles d'affichage (sans interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Constructeur de casque tenu pour validé, réservé aux tests (jamais activé
# par les binaires livrés).
essais = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bluer.workspace = true
tokio.workspace = true
futures.workspace = true

[dev-dependencies]
# Les tests d'intégration (tests/) utilisent la fonctionnalité essais.
momentum-core = { path = ".", features = ["essais"] }
