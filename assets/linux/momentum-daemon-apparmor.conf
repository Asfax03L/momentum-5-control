# Complément de momentum-daemon.service (drop-in) pour les systèmes où
# AppArmor restreint les espaces de noms utilisateur (Ubuntu 24.04 et
# suivants : kernel.apparmor_restrict_unprivileged_userns=1). Ces cinq
# options y empêchent le démarrage d'un service utilisateur ; le service n'a
# de toute façon aucune capacité, et son filtre d'appels système
# (@system-service) bloque déjà modules, horloge et journal du noyau.
# Sur ces systèmes, systemd n'applique pas non plus le masquage des
# fichiers (ProtectHome…) aux services utilisateur (docs/SECURITE.md).
#
# Posé par installer-linux.sh quand la restriction est active, et par le
# paquet .deb (Debian et Ubuntu).
[Service]
CapabilityBoundingSet=~
PrivateDevices=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
